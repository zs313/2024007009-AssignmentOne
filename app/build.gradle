plugins {
    id 'com.android.application'
}

android {
    namespace 'nz.ac.waikato.campuslife'
    compileSdk 37

    defaultConfig {
        applicationId 'nz.ac.waikato.campuslife'
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
}
